# This is a Databricks asset bundle definition for hl7_ingest.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: hl7_ingest

include:
  - resources/*.yml
  - resources/*/*.yml

sync:
  # The root .gitignore ignores any `dist/`; force-include the built control-room frontend so
  # it is synced and packaged into the app (FastAPI serves src/app/frontend/dist at runtime).
  include:
    - src/app/frontend/dist/**

presets:
  # Applied to every resource in the bundle that supports tagging (jobs, pipeline).
  tags:
    project: funke

variables:
  catalog:
    description: Only aprentis_dev_synthetic is allowed for Aprentis synthetic ADT.
    default: aprentis_dev_synthetic
  schema:
    description: Schema for Funke HL7 landing, bronze/silver, and ADT gold tables.
    default: hl7
  warehouse_id:
    description: SQL warehouse id backing the bed-utilization dashboard (required; pass --var warehouse_id=<id>)

artifacts:
  lib_funke:
    type: whl
    # Use a local venv so macOS PEP 668 / Homebrew Python can still build the wheel.
    build: python3 -m venv .venv && .venv/bin/pip install -q build && .venv/bin/python -m build
    dynamic_version: true

targets:
  # Aprentis default: synthetic catalog only. Development mode prefixes resources.
  # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
  dev_synthetic:
    mode: development
    default: true
    variables:
      catalog: aprentis_dev_synthetic
      schema: hl7

  prod:
    mode: production
    variables:
      catalog: aprentis_dev_synthetic
      schema: hl7
